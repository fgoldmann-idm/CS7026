<!DOCTYPE html>
<html lang= "en">
<head>
	<title>Newsletter</title>
	<h1>Subscribe to our Newsletter</h1>
</head>
<body>
	<p>
		<label for="name">First Name:</label>
		<input type:="text" id="name" name="name">
	</p>
	<p>
		<label for="lastname">Last Name:</label>
		<input type="text" id="lastname" name="lastname">
	</p>
	<p>
		<a>How would you like to receive your newsletter?</a>
		<form>
			<input type="radio" id="option1" name="choice" value="Post">
			<label for="option1">Post</label><br>
			<input type="radio" id="option2" name="choice" value="E-mail">
			<label for="option2">E-mail</label><br>
			<input type="radio" id="option3" name="choice" value="Signing telegram">
			<label for="option3">Signing telegram</label>
		</form>
	</p>

	<p>
		<a>How often do you wish to recieve your newletter?</a>
		<form>
			<input type="radio" id="option1" name="choice" value="daily">
			<label for="option1">daily</label><br>
			<input type="radio" id="option2" name="choice" value="weekly">
			<label for="option2">weekly</label><br>
			<input type="radio" id="option3" name="choice" value="monthly">
			<label for="option3">monthly</label>
		</form>
	</p>

	<p>
		<label for="password">Password:</label>
		<input type:="text" id="password" name="password">
	</p>

	<button type="button">Submit</button>

</body>
</html>
